<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>غَرْسة — الصفحة غير موجودة</title>
    <!--
      Cloudflare Pages: with a 404.html, an unknown path is a real 404 (no silent HTML
      fallback). That matters for /assets/*: a chunk from an old deploy then fails
      cleanly and the app reloads to the new version instead of mixing old and new code.
      App routes are rewritten in _redirects, so they are not affected.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf6ec;
        color: #1f3d37;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      a {
        color: #1b7f69;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>الصفحة غير موجودة</h1>
      <p><a href="/">العودة إلى غَرْسة</a></p>
    </main>
  </body>
</html>
