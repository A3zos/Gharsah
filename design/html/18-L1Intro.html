@keyframes gh-swap { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }

</style>

              <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                <path d="M12 20 C12 15.5 14.8 12.5 19 12 C19 16.5 16.2 19.6 12 20 Z" fill="#B57A10"></path>

          <span style="font-size: 13px; color: #5C716C; font-weight: 700;">{{ ayahSource }}</span>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0;">

            <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(244, 183, 64, 0.34); animation: gh-glow 1.5s ease-out infinite;"></span>
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: relative;">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF"></rect>
              <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { beat: 0, ayah: 1, step: 0, rep: 0, nudged: false };
  }
  renderVals() {
    const b = this.state.beat;
    const a = this.state.ayah;
    const s = this.state.step;
    const rep = this.state.rep;
    const nudged = this.state.nudged;

    const inAyah = b === 7;
    const complete = b === 8;
    const playing = inAyah && s === 0;
    const prompting = inAyah && s === 1;
    const liveHear = inAyah && s === 2;
    const liveCount = inAyah && s === 3;
    const liveNudge = inAyah && s === 4;
    const praising = inAyah && s === 5;
    const live = liveHear || liveCount || liveNudge;

    const listening = b === 6 || liveHear;
    const quiet = playing;
    const speaking = !listening && !quiet;
    const happy = praising || complete;

    const AR = ['١', '٢', '٣', '٤'];
    const TEXTS = [
      'قُلْ هُوَ اللَّهُ أَحَدٌ',
      'اللَّهُ الصَّمَدُ',
      'لَمْ يَلِدْ وَلَمْ يُولَدْ',
      'وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ'
    ];
    const PRAISES = [
      'أحسنت يا عبدالله… ننتقل للآية الثانية.',
      'ممتاز! ننتقل للآية الثالثة.',
      'رائع… بقيت الآية الأخيرة.',
      'أحسنت! أتممتها كلها.'
    ];
    const TIMERS = ['٠٢:٤٦', '٠٣:٢٠', '٠٣:٥٨', '٠٤:٣١'];
    const COUNTS = ['أحسنت… باقي مرتين.', 'ممتاز… باقي مرة.'];

    const welcomeCaptions = [
      'مساء الخير عبدالله! أنا معك الآن.',
      'اليوم نحفظ سورة، ثم حديث، وبعدهما مشروعك في البيت.',
      'نبدأ بسورة الإخلاص.',
      'نزلت في مكة… فهي سورة مكّية.',
      'وهي قصيرة — أربع آيات فقط!',
      'جاهز نبدأ نحفظ؟',
      'أسمعك…'
    ];
    const welcomeHints = [
      'اضغط المعلّم ليكمل',
      'اضغط المعلّم ليكمل',
      'اضغط المعلّم ليكمل',
      'اضغط المعلّم ليكمل',
      'اضغط المعلّم ليكمل',
      'أجب بصوتك: اضغط الميكروفون',
      'قل: نعم'
    ];

    let caption = '';
    let hint = '';
    if (complete) { caption = 'أتممت سورة الإخلاص كاملة… أحسنت يا عبدالله!'; hint = 'اضغط لتكمل مع المعلّم'; }
    else if (inAyah) {
      if (playing) { caption = 'استمع للآية… وأنا صامت معك'; hint = ''; }
      else if (prompting) { caption = 'الآن ردّد بصوتك… ثلاث مرات.'; hint = 'اضغط الميكروفون مرة واحدة ويبقى مفتوحًا'; }
      else if (liveHear) { caption = rep === 0 ? 'أسمعك… ردّد الآية.' : 'أسمعك…'; hint = 'الميكروفون مفتوح — لا تضغط شيئًا'; }
      else if (liveCount) { caption = COUNTS[rep - 1]; hint = 'الميكروفون ما زال مفتوحًا'; }
      else if (liveNudge) { caption = 'باقي مرة، هيا…'; hint = 'الميكروفون ما زال مفتوحًا'; }
      else { caption = PRAISES[a - 1]; hint = ''; }
    } else { caption = welcomeCaptions[b]; hint = welcomeHints[b]; }

    const card = (lit) => ({
      bg: lit ? '#EAF6F2' : '#FFFFFF',
      border: lit ? '2px solid #2FA98C' : '1.5px solid #EFE7D6',
      anim: lit ? 'gh-pop .45s ease-out both' : 'none'
    });
    const c1 = card(b === 1 || b === 2 || b === 3 || b === 4);
    const c2 = card(b === 1);
    const c3 = card(b === 1);


    const hv = [9, 14, 7, 16, 11, 18, 6, 13, 17, 8, 15, 10, 18, 7, 14, 9, 16, 11, 6, 13, 8];
    const childTalking = liveHear;
    const voiceBars = hv.map((h, i) => ({
      h: childTalking ? h : 4,
      c: childTalking ? '#1B7F69' : '#C9DED7',
      anim: childTalking ? ('gh-wave .8s ease-in-out ' + (i * 0.05).toFixed(2) + 's infinite') : 'none'
    }));

    const here = (st, rp) => this.state.beat === 7 && this.state.ayah === a && this.state.step === st && this.state.rep === rp;
    const later = (ms, st, rp, fn) => { setTimeout(() => { if (here(st, rp)) { fn(); } }, ms); };
    const set = (st, rp, nd) => this.setState({ beat: 7, ayah: a, step: st, rep: rp, nudged: nd });

    const countRep = () => {
      const n = rep + 1;
      if (n < 3) { this.setState({ beat: 7, ayah: a, step: 3, rep: n, nudged: nudged }); }
      else { this.setState({ beat: 7, ayah: a, step: 5, rep: 3, nudged: nudged }); }
    };
    const goNextAyah = () => {
      if (a < 4) { this.setState({ beat: 7, ayah: a + 1, step: 0, rep: 0, nudged: false }); }
      else { this.setState({ beat: 8, ayah: 4, step: 5, rep: 3, nudged: false }); }
    };

    if (playing) { later(3800, 0, rep, () => set(1, rep, nudged)); }
    if (liveHear) {
      if (rep === 2 && !nudged) { later(5000, 2, rep, () => set(4, rep, true)); }
      else { later(3800, 2, rep, countRep); }
    }
    if (liveCount) { later(1600, 3, rep, () => set(2, rep, nudged)); }
    if (liveNudge) { later(2200, 4, rep, () => set(2, rep, true)); }
    if (praising) { later(2400, 5, rep, goNextAyah); }

    return {
      phase1: b < 7,
      phase2: inAyah || complete,
      timer: complete ? '٠٥:٠٢' : (inAyah ? TIMERS[a - 1] : '٠٠:٢٤'),

      teacherAnim: listening ? 'gh-lean 2.6s ease-in-out infinite' : (quiet ? 'none' : 'gh-bob 1.7s ease-in-out infinite'),
      teacherOpacity: quiet ? '0.76' : '1',
      showGlow: !quiet,
      glowColor: listening ? 'rgba(244, 183, 64, 0.26)' : 'rgba(47, 169, 140, 0.20)',
      mouthOpen: speaking,
      mouthShut: !speaking,
      showArcs: speaking,
      eyesOpen: !happy,
      eyesHappy: happy,
      eyeR: listening ? 11.5 : 10,

      caption: caption,
      captionColor: happy ? '#1B7F69' : '#1F3D37',
      hint: hint,
      hintColor: (live || prompting || b === 6) ? '#7A5209' : '#5C716C',

      showFacts: b >= 3,
      showCount: b >= 4,
      p1bg: c1.bg, p1border: c1.border, p1anim: c1.anim,
      p2bg: c2.bg, p2border: c2.border, p2anim: c2.anim,
      p3bg: c3.bg, p3border: c3.border, p3anim: c3.anim,

      ayahText: TEXTS[a - 1],
      ayahSource: 'سورة الإخلاص · الآية ' + AR[a - 1],
      cardAnim: (a % 2 === 1 ? 'gh-swap' : 'gh-swap2') + ' .45s ease-out both',
      cardBorder: playing ? '2px solid #2FA98C' : '1.5px solid #EFE7D6',
      replay: () => { if (inAyah && !praising) { set(0, rep, nudged); } },

      voiceBars: voiceBars,

      micLive: (b === 6) || live,
      micLiveLabel: b === 6 ? 'قلت نعم' : 'كتم الميكروفون',
      micTap: () => {
        if (b === 6) { this.setState({ beat: 7, ayah: 1, step: 0, rep: 0, nudged: false }); }
        else { set(1, rep, nudged); }
      },
      micClosed: (b < 6) || playing || prompting,
      micPrompt: prompting,
      micOpacity: playing ? '0.5' : '1',
      micBorder: prompting ? '2px solid #F4B740' : '2px solid #E7DECB',
      micInk: prompting ? '#1F3D37' : '#5C716C',
      micIdle: praising,
      finished: complete,

      openMic: () => { if (b < 7) { this.setState({ beat: 6 }); } else { set(2, rep, nudged); } },
      next: () => {
        if (b < 5) { this.setState({ beat: b + 1 }); }
        else if (playing) { set(1, rep, nudged); }
        else if (liveHear || liveNudge) { countRep(); }
        else if (liveCount) { set(2, rep, nudged); }
        else if (praising) { goNextAyah(); }
      }
    };
  }
}
</script>
