<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>غَرسة — إضافة ابن</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Cairo:wght@400;500;700;800&amp;display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; direction: rtl; font-family: 'Cairo', system-ui, sans-serif; background: #FBF6EC; }
a { color: #1B7F69; }
a:hover { color: #14624F; }
input::placeholder { color: #8A9A95; }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF6EC; direction: rtl; color: #1F3D37; padding: 30px 20px 30px; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="Packages.dc.html" aria-label="رجوع" style="width: 46px; height: 46px; border-radius: 16px; background: #FFFFFF; border: 1px solid #EFE7D6; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 5 L16 12 L9 19" stroke="#1F3D37" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </a>
    <h1 style="margin: 0; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.5;">إضافة ابن</h1>
  </div>

  <div style="display: flex; align-items: center; gap: 6px;">
    <span style="display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border-radius: 13px; background: #EAF6F2; color: #1B7F69; font-size: 12.5px; font-weight: 700; flex-shrink: 0;">
      <span style="width: 21px; height: 21px; border-radius: 50%; background: #1B7F69; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; flex-shrink: 0;">١</span>
      البيانات
    </span>
    <span style="height: 2px; flex-grow: 1; background: #E4DCC8; border-radius: 2px;"></span>
    <span style="display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border-radius: 13px; background: #F4F0E4; color: #5C716C; font-size: 12.5px; font-weight: 700; flex-shrink: 0;">
      <span style="width: 21px; height: 21px; border-radius: 50%; background: #E4DCC8; color: #5C716C; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; flex-shrink: 0;">٢</span>
      الجدول
    </span>
    <span style="height: 2px; flex-grow: 1; background: #E4DCC8; border-radius: 2px;"></span>
    <span style="display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border-radius: 13px; background: #F4F0E4; color: #5C716C; font-size: 12.5px; font-weight: 700; flex-shrink: 0;">
      <span style="width: 21px; height: 21px; border-radius: 50%; background: #E4DCC8; color: #5C716C; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; flex-shrink: 0;">٣</span>
      الشخصية
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px;">
    <label for="child-name" style="font-size: 14px; font-weight: 700;">اسم الابن</label>
    <input id="child-name" name="child_name" type="text" placeholder="الاسم كما يحبّ أن يُنادى" style="width: 100%; height: 58px; border-radius: 20px; border: 1.5px solid #E7DECB; background: #FFFFFF; padding: 0 18px; font-family: 'Cairo', sans-serif; font-size: 16px; color: #1F3D37;">
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-size: 14px; font-weight: 700;">العمر</span>
      <span style="font-size: 12.5px; color: #5C716C;">من ٨ إلى ١٣ سنة</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <sc-for list="{{ages}}" as="age" hint-placeholder-count="6">
        <button type="button" onClick="{{ age.pick }}" aria-label="{{ age.label }}" style="flex-grow: 1; height: 56px; border-radius: 18px; border: {{ age.border }}; background: {{ age.bg }}; color: {{ age.fg }}; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 20px; font-weight: 700; cursor: pointer;">{{ age.digit }}</button>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <span style="font-size: 14px; font-weight: 700;">الجنس</span>
    <div style="display: flex; gap: 12px;">
      <button type="button" onClick="{{ pickGirl }}" style="flex-grow: 1; height: 128px; border-radius: 24px; border: {{ girlBorder }}; background: {{ girlBg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-family: 'Cairo', sans-serif;">
        <svg width="58" height="58" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="32" fill="#FDE9EF"></circle>
          <path d="M32 10 C20 10 14 19 14 31 C14 43 20 52 22 57 H42 C44 52 50 43 50 31 C50 19 44 10 32 10 Z" fill="#E86A92"></path>
          <ellipse cx="32" cy="31" rx="11" ry="12.5" fill="#F2C9A0"></ellipse>
          <path d="M21 28 C21 21 25 16 32 16 C39 16 43 21 43 28 Z" fill="#E86A92"></path>
          <circle cx="27.5" cy="32" r="2.3" fill="#3B2A24"></circle>
          <circle cx="37" cy="32" r="2.3" fill="#3B2A24"></circle>
          <path d="M28.5 38 C30.5 40 34 40 36.5 38" stroke="#3B2A24" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 700; color: #1F3D37;">بنت</span>
      </button>
      <button type="button" onClick="{{ pickBoy }}" style="flex-grow: 1; height: 128px; border-radius: 24px; border: {{ boyBorder }}; background: {{ boyBg }}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-family: 'Cairo', sans-serif;">
        <svg width="58" height="58" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="32" fill="#EAF6F2"></circle>
          <path d="M17 57 C17 47 24 42 32 42 C40 42 47 47 47 57 Z" fill="#2FA98C"></path>
          <ellipse cx="32" cy="30" rx="11.5" ry="12.5" fill="#E0A97C"></ellipse>
          <path d="M20 24 C20 17 25 12.5 32 12.5 C39 12.5 44 17 44 24 Z" fill="#F7F2E6"></path>
          <path d="M20.5 25 H43.5" stroke="#E4DCC8" stroke-width="2" stroke-linecap="round"></path>
          <circle cx="27.5" cy="31" r="2.3" fill="#3B2A24"></circle>
          <circle cx="37" cy="31" r="2.3" fill="#3B2A24"></circle>
          <path d="M28.5 37 C30.5 39 34 39 36.5 37" stroke="#3B2A24" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 700; color: #1F3D37;">ولد</span>
      </button>
    </div>
  </div>

  <div style="display: flex; align-items: flex-start; gap: 10px; background: #EAF6F2; border-radius: 18px; padding: 14px 16px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;">
      <circle cx="12" cy="12" r="9.5" stroke="#1B7F69" stroke-width="1.8"></circle>
      <path d="M12 11 V16.5" stroke="#1B7F69" stroke-width="2" stroke-linecap="round"></path>
      <circle cx="12" cy="7.8" r="1.3" fill="#1B7F69"></circle>
    </svg>
    <p style="margin: 0; font-size: 12.5px; color: #1F3D37; line-height: 1.8;">العمر يحدّد مستوى الحفظ والتمارين المقترحة، ويمكنك تعديله لاحقًا من لوحة التحكم.</p>
  </div>

  <a href="Schedule.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 20px; background: #1B7F69; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none; margin-top: auto;">التالي — جدول التعلّم</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { age: 10, gender: 'girl' };
  }
  renderVals() {
    const digits = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
    const toAr = (n) => String(n).split('').map((d) => digits[Number(d)]).join('');
    const ages = [8, 9, 10, 11, 12, 13].map((n) => {
      const on = this.state.age === n;
      return {
        digit: toAr(n),
        label: toAr(n) + ' سنوات',
        border: on ? '2px solid #1B7F69' : '1.5px solid #E7DECB',
        bg: on ? '#EAF6F2' : '#FFFFFF',
        fg: on ? '#1B7F69' : '#1F3D37',
        pick: () => this.setState({ age: n })
      };
    });
    const girl = this.state.gender === 'girl';
    return {
      ages: ages,
      pickGirl: () => this.setState({ gender: 'girl' }),
      pickBoy: () => this.setState({ gender: 'boy' }),
      girlBorder: girl ? '2px solid #1B7F69' : '1.5px solid #EFE7D6',
      girlBg: girl ? '#EAF6F2' : '#FFFFFF',
      boyBorder: girl ? '1.5px solid #EFE7D6' : '2px solid #1B7F69',
      boyBg: girl ? '#FFFFFF' : '#EAF6F2'
    };
  }
}
</script>
</body>
</html>
