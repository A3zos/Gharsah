<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>غَرسة — نسيت كلمة المرور</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Cairo:wght@400;500;700;800&amp;display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; direction: rtl; font-family: 'Cairo', system-ui, sans-serif; background: #FBF6EC; }
a { color: #1B7F69; }
a:hover { color: #14624F; }
@keyframes gh-pop { 0% { opacity: 0; transform: scale(0.84); } 60% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
@keyframes gh-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes gh-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes gh-glow { 0% { transform: scale(0.94); opacity: 0.5; } 100% { transform: scale(1.3); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; } }
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF6EC; direction: rtl; color: #1F3D37;">
  <div style="position: absolute; top: -160px; left: -140px; width: 400px; height: 400px; border-radius: 50%; background: rgba(47, 169, 140, 0.09);"></div>
  <div style="position: relative; z-index: 1; height: 100%; padding: 26px 20px 26px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; align-items: center; gap: 12px;">
    <a href="Login.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; border-radius: 15px; background: #FFFFFF; border: 1px solid #EFE7D6; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5 L16 12 L9 19" stroke="#1F3D37" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
      <h1 style="margin: 0; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.4;">نسيت كلمة المرور؟</h1>
    </span>
  </div>
    <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 18px;">
        <p style="margin: 0; font-size: 15px; line-height: 1.95; color: #5C716C;">اكتب بريدك وسنرسل لك رابطًا لإعادة تعيين كلمة المرور.</p>
        <label style="display: flex; flex-direction: column; gap: 9px;">
          <span style="font-size: 14.5px; font-weight: 700;">البريد الإلكتروني</span>
          <input id="reset-email" name="email" type="email" dir="ltr" placeholder="name@example.com" style="width: 100%; height: 58px; border-radius: 20px; border: 1.5px solid #E7DECB; background: #FFFFFF; padding: 0 18px; font-family: 'Cairo', sans-serif; font-size: 16px; color: #1F3D37; text-align: left;">
        </label>
        <button type="button" onClick="{{ send }}" style="height: 58px; border-radius: 20px; border: 0; background: #1B7F69; color: #FFFFFF; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 18px; font-weight: 700; cursor: pointer;">أرسل الرابط</button>
      </div>
    </sc-if>

    <sc-if value="{{ isSent }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 40px;">
        <span style="width: 108px; height: 108px; border-radius: 50%; background: #EAF6F2; display: flex; align-items: center; justify-content: center; animation: gh-pop .5s ease-out both;" aria-hidden="true">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><rect x="3" y="5.5" width="18" height="13" rx="3" stroke="#1B7F69" stroke-width="2"></rect><path d="M4 7 L12 13 L20 7" stroke="#1B7F69" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </span>
        <p style="margin: 0; text-align: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 26px; font-weight: 700; color: #1B7F69; line-height: 1.5;">أرسلنا رابطًا إلى بريدك</p>
        <p style="margin: 0; text-align: center; font-size: 15px; line-height: 1.95; color: #5C716C; max-width: 300px;">افتح الرسالة المُرسلة إلى <span dir="ltr" style="color: #1F3D37; font-weight: 700;">demo@gharsah.app</span> واتبع الرابط. تنتهي صلاحيته بعد ساعة.</p>
        <span style="background: #FDF1DA; color: #7A5209; font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 9px 16px;">لم تصلك؟ تحقّق من «غير المرغوب فيه»</span>
      </div>
    </sc-if>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
      <button type="button" onClick="{{ resend }}" style="height: 54px; border-radius: 20px; border: 1.5px solid #E7DECB; background: #FFFFFF; color: #5C716C; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer;">{{ secondLabel }}</button>
      <a href="Login.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; color: #1B7F69; font-size: 15px; font-weight: 700; text-decoration: none;">العودة لتسجيل الدخول</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sent: false };
  }
  renderVals() {
    const sent = this.state.sent === true;
    return {
      isForm: !sent,
      isSent: sent,
      secondLabel: sent ? 'إعادة الإرسال' : 'جرّب بريدًا آخر',
      send: () => this.setState({ sent: true }),
      resend: () => this.setState({ sent: !sent })
    };
  }
}
</script>
</body>
</html>
