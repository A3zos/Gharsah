<!doctype html>
<html lang="ar" dir="rtl">
<head>

</head>
<body>
<x-dc>
<helmet>

<style>

@keyframes gh-lean { 0%, 100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(-7deg) translateY(-3px); } }

@keyframes gh-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
@keyframes gh-pop { 0% { opacity: 0; transform: scale(0.84); } 60% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
@keyframes gh-swap { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes gh-swap2 { from { opacity: 0; transform: translateX(-26px); } to { opacity: 1; transform: none; } }
@keyframes gh-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; } }
</style>
</helmet>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">

      <span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px;">

          <path d="M56 78 C56 46 76 28 100 28 C124 28 144 46 144 78 C124 68 76 68 56 78 Z" fill="#FFFFFF"></path>

          <path d="M56 78 C56 46 76 28 100 28 C124 28 144 46 144 78" stroke="#E4E0D4" stroke-width="2" stroke-linecap="round"></path>

          <path d="M106 81 C110 76 122 76 126 82" stroke="#6B5646" stroke-width="3.4" stroke-linecap="round"></path>

          <g transform="rotate(-9 128 168)">
            <rect x="104" y="150" width="48" height="36" rx="6" fill="#1B7F69"></rect>
            <rect x="108" y="154" width="40" height="28" rx="4" fill="#FDF6E6"></rect>
            <path d="M128 154 V182" stroke="#E4DCC8" stroke-width="2"></path>
            <path d="M114 162 H124 M132 162 H142 M114 170 H124 M132 170 H142" stroke="#D8CDB4" stroke-width="2" stroke-linecap="round"></path>

          <circle cx="112" cy="186" r="9" fill="#E8B98C"></circle>

              <path d="M181 82 C192 96 192 118 181 132" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round" opacity="0.5"></path>
              <path d="M32 92 C24 100 24 112 32 120" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round"></path>

            </g>
          </sc-if>
        </svg>
      </span>
    </button>

    <div style="min-height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <p style="margin: 0; text-align: center; font-size: 17px; font-weight: 700; line-height: 1.7; color: {{ captionColor }};">{{ caption }}</p>
    </div>

    <div style="min-height: 292px; display: flex; flex-direction: column; justify-content: center; flex-shrink: 0;">

      <sc-if value="{{ topicOnly }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; background: #FFFFFF; border: 1.5px solid #EFE7D6; border-radius: 32px; padding: 32px 20px; box-shadow: 0 14px 30px rgba(31, 61, 55, 0.06); animation: gh-swap .45s ease-out both;">
          <span style="width: 68px; height: 68px; border-radius: 22px; background: #FDE9EF; display: flex; align-items: center; justify-content: center;" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
              <path d="M7 4 H17 C18.7 4 20 5.3 20 7 V20 H9.5 C8 20 7 18.8 7 17.3 Z" stroke="#A8365C" stroke-width="1.9" stroke-linejoin="round"></path>
              <path d="M7 4 C5.3 4 4 5.3 4 7 C4 8.2 4.9 9 6 9 H7" stroke="#A8365C" stroke-width="1.9" stroke-linejoin="round"></path>
            </svg>
          </span>
          <p style="margin: 0; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 28px; font-weight: 700; color: #1F3D37;">حديث برّ الوالدين</p>
          <span style="background: #FDE9EF; color: #A8365C; font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 7px 14px;">من كلام النبي ﷺ</span>
        </div>
      </sc-if>

      <sc-if value="{{ showHadith }}" hint-placeholder-val="{{ true }}">
        <button type="button" onClick="{{ replay }}" aria-label="أعد سماع الحديث" style="width: 100%; font-family: inherit; color: inherit; cursor: pointer; position: relative; background: #FFFFFF; border: {{ cardBorder }}; border-radius: 32px; padding: 24px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-shadow: 0 14px 30px rgba(31, 61, 55, 0.06); animation: gh-swap .45s ease-out both;">
          <span style="background: #FDE9EF; color: #A8365C; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 6px 13px;">حديث شريف</span>

          <p style="margin: 0; min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center;"><span style="display: block; border: 1.5px dashed #D8CDB4; border-radius: 18px; padding: 14px 14px; font-family: 'Cairo', sans-serif; font-size: 15px; font-weight: 700; line-height: 1.85; color: #7A5209; background: #FDF6E6;">[نص حديث برّ الوالدين — يُعتمد لاحقًا من مصدر موثّق مع التخريج والدرجة]</span></p>

          <span style="font-size: 13px; color: #9BA8A4; font-weight: 700;">[التخريج والدرجة — يُعتمد لاحقًا]</span>
        </button>
      </sc-if>


    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0;">

      <sc-if value="{{ micLive }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <button type="button" onClick="{{ muteMic }}" aria-label="كتم الميكروفون" style="position: relative; width: 118px; height: 118px; border-radius: 50%; border: 0; background: #F4B740; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 14px 30px rgba(244, 183, 64, 0.40);">
            <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(244, 183, 64, 0.34); animation: gh-glow 1.5s ease-out infinite;"></span>
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: relative;">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF"></rect>
              <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <div style="height: 18px; display: flex; align-items: center; justify-content: center; gap: 3px;" aria-hidden="true">
            <sc-for list="{{voiceBars}}" as="v" hint-placeholder-count="21">
              <span style="width: 3px; height: {{ v.h }}px; border-radius: 2px; background: {{ v.c }}; flex-shrink: 0; animation: {{ v.anim }};"></span>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ micClosed }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="position: relative; width: 118px; height: 118px; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{ micPrompt }}" hint-placeholder-val="{{ true }}">
              <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(244, 183, 64, 0.30); animation: gh-glow 1.5s ease-out infinite;"></span>
            </sc-if>
            <button type="button" onClick="{{ openMic }}" aria-label="افتح الميكروفون وابدأ الترديد" style="position: relative; width: 118px; height: 118px; border-radius: 50%; border: {{ micBorder }}; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 22px rgba(31, 61, 55, 0.08); opacity: {{ micOpacity }};">
              <svg width="50" height="50" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" stroke="{{ micInk }}" stroke-width="2"></rect>
                <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="{{ micInk }}" stroke-width="2" stroke-linecap="round"></path>
                <path d="M4.2 19.8 L19.8 4.2" stroke="#A8365C" stroke-width="2.4" stroke-linecap="round"></path>
              </svg>
            </button>
          </span>
          <span style="height: 18px;"></span>
        </div>
      </sc-if>

      <sc-if value="{{ micIdle }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="width: 118px; height: 118px; border-radius: 50%; border: 2px solid #E7DECB; background: #FFFFFF; display: flex; align-items: center; justify-content: center; opacity: 0.45; box-shadow: 0 10px 22px rgba(31, 61, 55, 0.06);" aria-hidden="true">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="3" width="6" height="11" rx="3" stroke="#5C716C" stroke-width="2"></rect>
              <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="#5C716C" stroke-width="2" stroke-linecap="round"></path>
              <path d="M4.2 19.8 L19.8 4.2" stroke="#A8365C" stroke-width="2.4" stroke-linecap="round"></path>
            </svg>
          </span>
          <span style="height: 18px;"></span>

      <sc-if value="{{ goingNext }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">

            <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(47, 169, 140, 0.34); animation: gh-glow 1.5s ease-out infinite;"></span>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: relative;">
              <path d="M15 5 L8 12 L15 19" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>

      <span style="height: 18px; text-align: center; font-size: 12.5px; color: {{ hintColor }}; font-weight: 700;">{{ hint }}</span>

  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1010}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, rep: 0, nudged: false };
  }
  renderVals() {
    const s = this.state.step;
    const rep = this.state.rep;
    const nudged = this.state.nudged;

    const topic = s === 0;
    const playing = s === 1;
    const prompting = s === 2;
    const liveHear = s === 3;
    const liveCount = s === 4;
    const liveNudge = s === 5;
    const praising = s === 6;
    const handoff = s === 7;
    const live = liveHear || liveCount || liveNudge;

    const listening = liveHear;
    const quiet = playing;
    const speaking = !listening && !quiet;
    const happy = praising || handoff;

    const COUNTS = ['أحسنت… باقي مرتين.', 'ممتاز… باقي مرة.'];

    let caption = '';
    let hint = '';
    if (topic) { caption = 'والآن حديث اليوم يا عبدالله… حديث برّ الوالدين.'; hint = 'اضغط المعلّم ليكمل'; }
    else if (playing) { caption = 'استمع للحديث… وأنا صامت معك'; hint = ''; }
    else if (prompting) { caption = 'الآن ردّد بصوتك… ثلاث مرات.'; hint = 'اضغط الميكروفون مرة واحدة ويبقى مفتوحًا'; }
    else if (liveHear) { caption = rep === 0 ? 'أسمعك… ردّد الحديث.' : 'أسمعك…'; hint = 'الميكروفون مفتوح — لا تضغط شيئًا'; }
    else if (liveCount) { caption = COUNTS[rep - 1]; hint = 'الميكروفون ما زال مفتوحًا'; }
    else if (liveNudge) { caption = 'باقي مرة، هيا…'; hint = 'الميكروفون ما زال مفتوحًا'; }
    else if (praising) { caption = 'أحسنت يا عبدالله… حفظت حديث اليوم.'; hint = ''; }
    else { caption = 'والآن… مشروع هذا الأسبوع.'; hint = 'ننتقل…'; }


    const hv = [9, 14, 7, 16, 11, 18, 6, 13, 17, 8, 15, 10, 18, 7, 14, 9, 16, 11, 6, 13, 8];
    const childTalking = liveHear;
    const voiceBars = hv.map((h, i) => ({
      h: childTalking ? h : 4,
      c: childTalking ? '#1B7F69' : '#C9DED7',
      anim: childTalking ? ('gh-wave .8s ease-in-out ' + (i * 0.05).toFixed(2) + 's infinite') : 'none'
    }));

    const here = (st, rp) => this.state.step === st && this.state.rep === rp;
    const later = (ms, st, rp, fn) => { setTimeout(() => { if (here(st, rp)) { fn(); } }, ms); };
    const set = (st, rp, nd) => this.setState({ step: st, rep: rp, nudged: nd });

    const countRep = () => {
      const n = rep + 1;
      if (n < 3) { this.setState({ step: 4, rep: n, nudged: nudged }); }
      else { this.setState({ step: 6, rep: 3, nudged: nudged }); }
    };

    if (topic) { later(2300, 0, rep, () => set(1, rep, nudged)); }
    if (playing) { later(4200, 1, rep, () => set(2, rep, nudged)); }
    if (liveHear) {
      if (rep === 2 && !nudged) { later(5000, 3, rep, () => set(5, rep, true)); }
      else { later(3800, 3, rep, countRep); }
    }
    if (liveCount) { later(1600, 4, rep, () => set(3, rep, nudged)); }
    if (liveNudge) { later(2200, 5, rep, () => set(3, rep, true)); }
    if (praising) { later(2400, 6, rep, () => set(7, rep, nudged)); }

    return {
      timer: handoff ? '٠٧:٠٤' : '٠٦:١٢',

      teacherAnim: listening ? 'gh-lean 2.6s ease-in-out infinite' : (quiet ? 'none' : 'gh-bob 1.7s ease-in-out infinite'),
      teacherOpacity: quiet ? '0.76' : '1',
      showGlow: !quiet,
      glowColor: listening ? 'rgba(244, 183, 64, 0.26)' : 'rgba(47, 169, 140, 0.20)',
      mouthOpen: speaking,
      mouthShut: !speaking,
      showArcs: speaking,
      eyesOpen: !happy,
      eyesHappy: happy,
      eyeR: listening ? 11.5 : 10,

      caption: caption,
      captionColor: happy ? '#1B7F69' : '#1F3D37',
      hint: hint,
      hintColor: (live || prompting) ? '#7A5209' : '#5C716C',

      topicOnly: topic,
      showHadith: playing || prompting || live || praising || handoff,
      cardBorder: playing ? '2px solid #2FA98C' : '1.5px solid #EFE7D6',
      replay: () => { if (playing || prompting || live) { set(1, rep, nudged); } },

      voiceBars: voiceBars,

      micLive: live,
      muteMic: () => set(2, rep, nudged),
      micClosed: topic || playing || prompting,
      micPrompt: prompting,
      micOpacity: (topic || playing) ? '0.5' : '1',
      micBorder: prompting ? '2px solid #F4B740' : '2px solid #E7DECB',
      micInk: prompting ? '#1F3D37' : '#5C716C',
      micIdle: praising,
      goingNext: handoff,

      openMic: () => set(3, rep, nudged),
      next: () => {
        if (topic) { set(1, rep, nudged); }
        else if (playing) { set(2, rep, nudged); }
        else if (liveHear || liveNudge) { countRep(); }
        else if (liveCount) { set(3, rep, nudged); }
        else if (praising) { set(7, rep, nudged); }
      }
    };
  }
}
</script>
