<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>غَرسة — حصة الغد: تقرير المشروع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Cairo:wght@400;500;700;800&amp;display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; direction: rtl; font-family: 'Cairo', system-ui, sans-serif; background: #FBF6EC; }
a { color: #1B7F69; }
a:hover { color: #14624F; }
@keyframes gh-bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(1.2deg); } }
@keyframes gh-lean { 0%, 100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(-7deg) translateY(-3px); } }
@keyframes gh-glow { 0% { transform: scale(0.94); opacity: 0.5; } 100% { transform: scale(1.32); opacity: 0; } }
@keyframes gh-wave { 0%, 100% { transform: scaleY(0.22); } 50% { transform: scaleY(1); } }
@keyframes gh-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
@keyframes gh-pop { 0% { opacity: 0; transform: scale(0.84); } 60% { opacity: 1; transform: scale(1.04); } 100% { opacity: 1; transform: scale(1); } }
@keyframes gh-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes gh-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; } }
</style>
</helmet>
<div style="width: 390px; height: 880px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF6EC; direction: rtl; color: #1F3D37; padding: 24px 20px 26px; display: flex; justify-content: center;">
  <div style="position: absolute; top: -160px; left: -130px; width: 380px; height: 380px; border-radius: 50%; background: rgba(47, 169, 140, 0.09);"></div>

  <div style="flex-grow: 1; max-width: 520px; display: flex; flex-direction: column; gap: 12px; z-index: 1;">

    <div style="display: flex; align-items: center; gap: 11px; flex-shrink: 0;">
      <a href="ExitConfirm.dc.html" aria-label="إنهاء المكالمة" style="width: 44px; height: 44px; border-radius: 50%; background: #FDE9EF; border: 1px solid #F6D3DF; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6 L18 18 M18 6 L6 18" stroke="#A8365C" stroke-width="2.6" stroke-linecap="round"></path>
        </svg>
      </a>
      <span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #F6D3DF; border-radius: 999px; padding: 7px 13px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #E86A92; animation: gh-blink 1.4s ease-in-out infinite;"></span>
          <span style="font-size: 12px; font-weight: 800; color: #A8365C;">مباشر</span>
        </span>
        <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 13.5px; font-weight: 700; color: #5C716C;">{{ timer }}</span>
      </span>
      <span style="width: 44px; flex-shrink: 0;"></span>
    </div>

    <button type="button" onClick="{{ next }}" aria-label="تابع مع المعلّم" style="position: relative; display: flex; align-items: center; justify-content: center; height: 178px; border: 0; background: transparent; padding: 0; cursor: pointer; flex-shrink: 0;">
      <span style="position: absolute; width: 172px; height: 172px; border-radius: 50%; background: {{ glowColor }}; animation: gh-glow 2.1s ease-out infinite;"></span>
      <span style="position: relative; animation: {{ teacherAnim }};">
        <svg width="170" height="170" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <path d="M56 194 C56 154 72 134 100 134 C128 134 144 154 144 194 Z" fill="#FFFFFF"></path>
          <path d="M56 194 C56 164 64 146 78 138 C70 152 66 172 66 194 Z" fill="#F1EFE6"></path>
          <path d="M88 138 L100 154 L112 138" stroke="#DDE2DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <ellipse cx="100" cy="132" rx="13" ry="11" fill="#D9A273"></ellipse>
          <ellipse cx="56" cy="94" rx="7" ry="9.5" fill="#E8B98C"></ellipse>
          <ellipse cx="144" cy="94" rx="7" ry="9.5" fill="#E8B98C"></ellipse>
          <ellipse cx="100" cy="90" rx="44" ry="46" fill="#E8B98C"></ellipse>
          <path d="M62 100 C62 138 80 154 100 154 C120 154 138 138 138 100 C130 122 116 128 100 128 C84 128 70 122 62 100 Z" fill="#6B5646"></path>
          <path d="M56 78 C56 46 76 28 100 28 C124 28 144 46 144 78 C124 68 76 68 56 78 Z" fill="#FFFFFF"></path>
          <path d="M54 78 C76 67 124 67 146 78 C146 87 141 91 135 90 C114 82 86 82 65 90 C59 91 54 87 54 78 Z" fill="#F4F2EA"></path>
          <path d="M56 78 C56 46 76 28 100 28 C124 28 144 46 144 78" stroke="#E4E0D4" stroke-width="2" stroke-linecap="round"></path>
          <path d="M74 82 C78 76 90 76 94 81" stroke="#6B5646" stroke-width="3.4" stroke-linecap="round"></path>
          <path d="M106 81 C110 76 122 76 126 82" stroke="#6B5646" stroke-width="3.4" stroke-linecap="round"></path>
          <sc-if value="{{ eyesOpen }}" hint-placeholder-val="{{ true }}">
            <g>
              <ellipse cx="84" cy="98" rx="9" ry="{{ eyeR }}" fill="#FFFFFF"></ellipse>
              <ellipse cx="116" cy="98" rx="9" ry="{{ eyeR }}" fill="#FFFFFF"></ellipse>
              <circle cx="85" cy="100" r="5" fill="#2A211C"></circle>
              <circle cx="117" cy="100" r="5" fill="#2A211C"></circle>
              <circle cx="87" cy="97" r="1.8" fill="#FFFFFF"></circle>
              <circle cx="119" cy="97" r="1.8" fill="#FFFFFF"></circle>
            </g>
          </sc-if>
          <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ true }}">
            <g>
              <path d="M75 101 C79 93 89 93 93 101" stroke="#2A211C" stroke-width="4" stroke-linecap="round"></path>
              <path d="M107 101 C111 93 121 93 125 101" stroke="#2A211C" stroke-width="4" stroke-linecap="round"></path>
            </g>
          </sc-if>
          <ellipse cx="68" cy="112" rx="8" ry="5.5" fill="#E86A92" opacity="0.35"></ellipse>
          <ellipse cx="132" cy="112" rx="8" ry="5.5" fill="#E86A92" opacity="0.35"></ellipse>
          <sc-if value="{{ mouthOpen }}" hint-placeholder-val="{{ true }}">
            <ellipse cx="100" cy="121" rx="9" ry="7" fill="#7A3B2E"></ellipse>
          </sc-if>
          <sc-if value="{{ mouthShut }}" hint-placeholder-val="{{ true }}">
            <path d="M90 118 C94 125 106 125 110 118" stroke="#7A3B2E" stroke-width="3.4" stroke-linecap="round"></path>
          </sc-if>
          <ellipse cx="60" cy="170" rx="14" ry="22" fill="#FFFFFF" transform="rotate(14 60 170)"></ellipse>
          <path d="M46 168 C46 158 52 150 60 148" stroke="#E4E0D4" stroke-width="2" stroke-linecap="round"></path>
          <g transform="rotate(-9 128 168)">
            <rect x="104" y="150" width="48" height="36" rx="6" fill="#1B7F69"></rect>
            <rect x="108" y="154" width="40" height="28" rx="4" fill="#FDF6E6"></rect>
            <path d="M128 154 V182" stroke="#E4DCC8" stroke-width="2"></path>
            <path d="M114 162 H124 M132 162 H142 M114 170 H124 M132 170 H142" stroke="#D8CDB4" stroke-width="2" stroke-linecap="round"></path>
          </g>
          <circle cx="112" cy="186" r="9" fill="#E8B98C"></circle>
          <sc-if value="{{ showArcs }}" hint-placeholder-val="{{ true }}">
            <g>
              <path d="M168 92 C176 100 176 112 168 120" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round"></path>
              <path d="M181 82 C192 96 192 118 181 132" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round" opacity="0.5"></path>
              <path d="M32 92 C24 100 24 112 32 120" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round"></path>
              <path d="M19 82 C8 96 8 118 19 132" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round" opacity="0.5"></path>
            </g>
          </sc-if>
        </svg>
      </span>
    </button>

    <div style="min-height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <p style="margin: 0; text-align: center; font-size: 17px; font-weight: 700; line-height: 1.7; color: {{ captionColor }};">{{ caption }}</p>
    </div>

    <div style="min-height: 250px; display: flex; flex-direction: column; justify-content: center; gap: 9px; flex-shrink: 0;">

      <div style="position: relative; background: #FFFFFF; border: {{ cardBorder }}; border-radius: 28px; padding: 22px 18px 18px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 12px 28px rgba(31, 61, 55, 0.06); animation: gh-pop .5s ease-out both;">
        <span style="position: absolute; top: -13px; right: 24px; background: #FDF1DA; color: #7A5209; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 6px 14px; border: 1px solid #EFD9A8;">مشروع الأمس</span>
        <span style="animation: gh-float 3.2s ease-in-out infinite;" aria-hidden="true">
          <svg width="58" height="58" viewBox="0 0 64 64" fill="none">
            <path d="M32 38 V18" stroke="#1B7F69" stroke-width="3.4" stroke-linecap="round"></path>
            <path d="M32 28 C24 28 19 23 19 15 C27 15 32 20 32 28 Z" fill="#2FA98C"></path>
            <path d="M32 24 C40 24 45 19 45 11 C37 11 32 16 32 24 Z" fill="#7ACBB6"></path>
            <path d="M6 38 C6 50 17 58 32 58 C47 58 58 50 58 38 C58 34 54 32 51 34 L40 41 L24 41 L13 34 C10 32 6 34 6 38 Z" fill="#F4B740"></path>
            <path d="M24 41 C24 37 28 35 32 35 C36 35 40 37 40 41 Z" fill="#E0A82A"></path>
          </svg>
        </span>
        <p style="margin: 0; text-align: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 23px; font-weight: 700; color: #1F3D37; line-height: 1.55;">برّ والديك اليوم بعمل</p>

        <sc-if value="{{ recording }}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; align-items: center; gap: 8px; background: #FDE9EF; border-radius: 999px; padding: 8px 15px; animation: gh-pop .4s ease-out both;">
            <span style="width: 9px; height: 9px; border-radius: 50%; background: #E86A92; animation: gh-blink 1.1s ease-in-out infinite;"></span>
            <span style="font-size: 13px; font-weight: 800; color: #A8365C;">جارٍ التسجيل · ٠:٠٨</span>
          </span>
        </sc-if>

        <sc-if value="{{ saved }}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; align-items: center; gap: 8px; background: #EAF6F2; border-radius: 999px; padding: 8px 15px; animation: gh-pop .4s ease-out both;">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" stroke="#1B7F69" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            <span style="font-size: 13px; font-weight: 800; color: #1B7F69;">حُفظ صوتك · ٠:١٢</span>
          </span>
        </sc-if>
      </div>

      <sc-if value="{{ saved }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 8px; animation: gh-rise .4s ease-out both;">
          <span style="text-align: center; font-size: 12.5px; color: #5C716C; font-weight: 700; line-height: 1.7;">يصل إلى لوحة والدك — لا يُنشر لأحد غيره.</span>
          <button type="button" onClick="{{ reRecord }}" style="height: 48px; border-radius: 16px; border: 1.5px solid #E7DECB; background: #FFFFFF; color: #5C716C; font-family: 'Cairo', sans-serif; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 12 A7.5 7.5 0 1 1 7.4 17.9" stroke="#5C716C" stroke-width="2.2" stroke-linecap="round"></path>
              <path d="M4.5 7 V12 H9.5" stroke="#5C716C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            أعِد التسجيل
          </button>
        </div>
      </sc-if>

    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0;">

      <sc-if value="{{ recording }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <button type="button" onClick="{{ stopRecord }}" aria-label="أنهيت كلامي" style="position: relative; width: 118px; height: 118px; border-radius: 50%; border: 0; background: #F4B740; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 14px 30px rgba(244, 183, 64, 0.40);">
            <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(244, 183, 64, 0.34); animation: gh-glow 1.5s ease-out infinite;"></span>
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: relative;">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF"></rect>
              <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <div style="height: 18px; display: flex; align-items: center; justify-content: center; gap: 3px;" aria-hidden="true">
            <sc-for list="{{voiceBars}}" as="v" hint-placeholder-count="21">
              <span style="width: 3px; height: {{ v.h }}px; border-radius: 2px; background: {{ v.c }}; flex-shrink: 0; animation: {{ v.anim }};"></span>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ micClosed }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="position: relative; width: 118px; height: 118px; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{ micPrompt }}" hint-placeholder-val="{{ true }}">
              <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(244, 183, 64, 0.30); animation: gh-glow 1.5s ease-out infinite;"></span>
            </sc-if>
            <button type="button" onClick="{{ openMic }}" aria-label="افتح الميكروفون واحكِ للمعلّم" style="position: relative; width: 118px; height: 118px; border-radius: 50%; border: {{ micBorder }}; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 22px rgba(31, 61, 55, 0.08); opacity: {{ micOpacity }};">
              <svg width="50" height="50" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" stroke="{{ micInk }}" stroke-width="2"></rect>
                <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="{{ micInk }}" stroke-width="2" stroke-linecap="round"></path>
                <path d="M4.2 19.8 L19.8 4.2" stroke="#A8365C" stroke-width="2.4" stroke-linecap="round"></path>
              </svg>
            </button>
          </span>
          <span style="height: 18px;"></span>
        </div>
      </sc-if>

      <sc-if value="{{ goingNext }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <a href="L7Hadith.dc.html" aria-label="ابدأ حديث اليوم" style="position: relative; width: 118px; height: 118px; border-radius: 50%; background: #1B7F69; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 14px 30px rgba(27, 127, 105, 0.32);">
            <span style="position: absolute; width: 118px; height: 118px; border-radius: 50%; background: rgba(47, 169, 140, 0.34); animation: gh-glow 1.5s ease-out infinite;"></span>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: relative;">
              <path d="M15 5 L8 12 L15 19" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </a>
          <span style="height: 18px;"></span>
        </div>
      </sc-if>

      <span style="height: 18px; text-align: center; font-size: 12.5px; color: {{ hintColor }}; font-weight: 700;">{{ hint }}</span>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":880}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { beat: 0 };
  }
  renderVals() {
    const b = this.state.beat;

    const greet = b === 0;
    const asking = b === 1;
    const recording = b === 2;
    const saved = b === 3;
    const closing = b === 4;

    const listening = recording;
    const speaking = !listening;
    const happy = greet || saved || closing;

    const captions = [
      'صباح الخير يا عبدالله! اشتقت لك.',
      'علّمني كيف بررت والديك أمس.',
      'أسمعك… احكِ لي.',
      'أحسنت يا عبدالله… سمعتك، وفرحت بك.',
      'والآن… حديث اليوم الجديد.'
    ];
    const hints = [
      '',
      'اضغط الميكروفون واحكِ بصوتك',
      'اضغط مرة أخرى حين تنتهي',
      'أو أعد التسجيل إن أحببت',
      'ننتقل للحديث…'
    ];

    const hv = [9, 14, 7, 16, 11, 18, 6, 13, 17, 8, 15, 10, 18, 7, 14, 9, 16, 11, 6, 13, 8];
    const voiceBars = hv.map((h, i) => ({
      h: recording ? h : 4,
      c: recording ? '#1B7F69' : '#C9DED7',
      anim: recording ? ('gh-wave .8s ease-in-out ' + (i * 0.05).toFixed(2) + 's infinite') : 'none'
    }));

    const at = (x) => this.state.beat === x;
    const later = (ms, x, fn) => { setTimeout(() => { if (at(x)) { fn(); } }, ms); };
    if (greet) { later(2400, 0, () => this.setState({ beat: 1 })); }
    if (saved) { later(3200, 3, () => this.setState({ beat: 4 })); }

    return {
      timer: '٠٠:٣٨',
      teacherAnim: listening ? 'gh-lean 2.6s ease-in-out infinite' : 'gh-bob 1.7s ease-in-out infinite',
      glowColor: listening ? 'rgba(244, 183, 64, 0.26)' : 'rgba(47, 169, 140, 0.20)',
      mouthOpen: speaking,
      mouthShut: !speaking,
      showArcs: speaking,
      eyesOpen: !happy,
      eyesHappy: happy,
      eyeR: listening ? 11.5 : 10,

      caption: captions[b],
      captionColor: happy ? '#1B7F69' : '#1F3D37',
      hint: hints[b],
      hintColor: (asking || recording) ? '#7A5209' : '#5C716C',

      cardBorder: recording ? '2px solid #F4B740' : (saved ? '2px solid #2FA98C' : '1.5px solid #EFE7D6'),
      recording: recording,
      saved: saved || closing,
      voiceBars: voiceBars,

      micClosed: greet || asking,
      micPrompt: asking,
      micOpacity: asking ? '1' : '0.5',
      micBorder: asking ? '2px solid #F4B740' : '2px solid #E7DECB',
      micInk: asking ? '#1F3D37' : '#5C716C',
      goingNext: saved || closing,

      openMic: () => this.setState({ beat: 2 }),
      stopRecord: () => this.setState({ beat: 3 }),
      reRecord: () => this.setState({ beat: 2 }),
      next: () => {
        if (b === 0) { this.setState({ beat: 1 }); }
        else if (b === 3) { this.setState({ beat: 4 }); }
      }
    };
  }
}
</script>
</body>
</html>
