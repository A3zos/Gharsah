<!doctype html>
<html lang="ar" dir="rtl">
<head>

<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&amp;family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&amp;family=Cairo:wght@400;500;700;800&amp;display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; direction: rtl; font-family: 'Cairo', system-ui, sans-serif; background: #FBF6EC; }
a { color: #1B7F69; }
a:hover { color: #14624F; }
@keyframes gh-bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-7px) rotate(1.2deg); } }
@keyframes gh-lean { 0%, 100% { transform: rotate(-7deg) translateY(0); } 50% { transform: rotate(-7deg) translateY(-3px); } }
@keyframes gh-glow { 0% { transform: scale(0.94); opacity: 0.5; } 100% { transform: scale(1.32); opacity: 0; } }
@keyframes gh-wave { 0%, 100% { transform: scaleY(0.22); } 50% { transform: scaleY(1); } }
@keyframes gh-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
@keyframes gh-pop { 0% { opacity: 0; transform: scale(0.72); } 62% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
@keyframes gh-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes gh-spark { 0% { opacity: 0; transform: scale(0.4) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(12deg); } 100% { opacity: 0; transform: scale(0.6) rotate(24deg); } }
@keyframes gh-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes gh-grow-up { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001s !important; animation-iteration-count: 1 !important; } }
</style>
</helmet>
<div style="width: 390px; height: 1030px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBF6EC; direction: rtl; color: #1F3D37; padding: 24px 20px 26px; display: flex; justify-content: center;">
  <div style="position: absolute; top: -150px; left: -130px; width: 350px; height: 350px; border-radius: 50%; background: rgba(47, 169, 140, 0.10);"></div>
  <div style="position: absolute; bottom: -130px; right: -110px; width: 300px; height: 300px; border-radius: 50%; background: rgba(244, 183, 64, 0.12);"></div>

  <div style="flex-grow: 1; max-width: 520px; display: flex; flex-direction: column; gap: 11px; z-index: 1;">

    <div style="display: flex; align-items: center; gap: 11px; flex-shrink: 0;">
      <a href="ExitConfirm.dc.html" aria-label="إنهاء المكالمة" style="width: 44px; height: 44px; border-radius: 50%; background: #FDE9EF; border: 1px solid #F6D3DF; display: flex; align-items: center; justify-content: center; text-decoration: none; flex-shrink: 0;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6 L18 18 M18 6 L6 18" stroke="#A8365C" stroke-width="2.6" stroke-linecap="round"></path>
        </svg>
      </a>
      <span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #F6D3DF; border-radius: 999px; padding: 7px 13px;">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #E86A92; animation: gh-blink 1.4s ease-in-out infinite;"></span>
          <span style="font-size: 12px; font-weight: 800; color: #A8365C;">مباشر</span>
        </span>
        <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 13.5px; font-weight: 700; color: #5C716C;">٠٩:٤٧</span>
      </span>
      <span style="width: 44px; flex-shrink: 0;"></span>
    </div>

    <button type="button" onClick="{{ next }}" aria-label="تابع مع المعلّم" style="position: relative; display: flex; align-items: center; justify-content: center; height: 172px; border: 0; background: transparent; padding: 0; cursor: pointer; flex-shrink: 0;">
      <span style="position: absolute; width: 166px; height: 166px; border-radius: 50%; background: {{ glowColor }}; animation: gh-glow 2.1s ease-out infinite;"></span>
      <span style="position: relative; animation: {{ teacherAnim }};">
        <svg width="164" height="164" viewBox="0 0 200 200" fill="none" aria-hidden="true">
          <path d="M56 194 C56 154 72 134 100 134 C128 134 144 154 144 194 Z" fill="#FFFFFF"></path>
          <path d="M56 194 C56 164 64 146 78 138 C70 152 66 172 66 194 Z" fill="#F1EFE6"></path>
          <path d="M88 138 L100 154 L112 138" stroke="#DDE2DA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
          <ellipse cx="100" cy="132" rx="13" ry="11" fill="#D9A273"></ellipse>
          <ellipse cx="56" cy="94" rx="7" ry="9.5" fill="#E8B98C"></ellipse>
          <ellipse cx="144" cy="94" rx="7" ry="9.5" fill="#E8B98C"></ellipse>
          <ellipse cx="100" cy="90" rx="44" ry="46" fill="#E8B98C"></ellipse>
          <path d="M62 100 C62 138 80 154 100 154 C120 154 138 138 138 100 C130 122 116 128 100 128 C84 128 70 122 62 100 Z" fill="#6B5646"></path>
          <path d="M56 78 C56 46 76 28 100 28 C124 28 144 46 144 78 C124 68 76 68 56 78 Z" fill="#FFFFFF"></path>
          <path d="M54 78 C76 67 124 67 146 78 C146 87 141 91 135 90 C114 82 86 82 65 90 C59 91 54 87 54 78 Z" fill="#F4F2EA"></path>
          <path d="M56 78 C56 46 76 28 100 28 C124 28 144 46 144 78" stroke="#E4E0D4" stroke-width="2" stroke-linecap="round"></path>
          <path d="M74 82 C78 76 90 76 94 81" stroke="#6B5646" stroke-width="3.4" stroke-linecap="round"></path>
          <path d="M106 81 C110 76 122 76 126 82" stroke="#6B5646" stroke-width="3.4" stroke-linecap="round"></path>
          <sc-if value="{{ eyesOpen }}" hint-placeholder-val="{{ true }}">
            <g>
              <ellipse cx="84" cy="98" rx="9" ry="{{ eyeR }}" fill="#FFFFFF"></ellipse>
              <ellipse cx="116" cy="98" rx="9" ry="{{ eyeR }}" fill="#FFFFFF"></ellipse>
              <circle cx="85" cy="100" r="5" fill="#2A211C"></circle>
              <circle cx="117" cy="100" r="5" fill="#2A211C"></circle>
              <circle cx="87" cy="97" r="1.8" fill="#FFFFFF"></circle>
              <circle cx="119" cy="97" r="1.8" fill="#FFFFFF"></circle>
            </g>
          </sc-if>
          <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ true }}">
            <g>
              <path d="M75 101 C79 93 89 93 93 101" stroke="#2A211C" stroke-width="4" stroke-linecap="round"></path>
              <path d="M107 101 C111 93 121 93 125 101" stroke="#2A211C" stroke-width="4" stroke-linecap="round"></path>
            </g>
          </sc-if>
          <ellipse cx="68" cy="112" rx="8" ry="5.5" fill="#E86A92" opacity="0.35"></ellipse>
          <ellipse cx="132" cy="112" rx="8" ry="5.5" fill="#E86A92" opacity="0.35"></ellipse>
          <sc-if value="{{ mouthOpen }}" hint-placeholder-val="{{ true }}">

          </sc-if>
          <sc-if value="{{ mouthShut }}" hint-placeholder-val="{{ true }}">
            <path d="M90 118 C94 125 106 125 110 118" stroke="#7A3B2E" stroke-width="3.4" stroke-linecap="round"></path>
          </sc-if>
          <ellipse cx="60" cy="170" rx="14" ry="22" fill="#FFFFFF" transform="rotate(14 60 170)"></ellipse>
          <path d="M46 168 C46 158 52 150 60 148" stroke="#E4E0D4" stroke-width="2" stroke-linecap="round"></path>
          <g transform="rotate(-9 128 168)">
            <rect x="104" y="150" width="48" height="36" rx="6" fill="#1B7F69"></rect>
            <rect x="108" y="154" width="40" height="28" rx="4" fill="#FDF6E6"></rect>
            <path d="M128 154 V182" stroke="#E4DCC8" stroke-width="2"></path>
            <path d="M114 162 H124 M132 162 H142 M114 170 H124 M132 170 H142" stroke="#D8CDB4" stroke-width="2" stroke-linecap="round"></path>
          </g>
          <circle cx="112" cy="186" r="9" fill="#E8B98C"></circle>
          <sc-if value="{{ showArcs }}" hint-placeholder-val="{{ true }}">
            <g>
              <path d="M168 92 C176 100 176 112 168 120" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round"></path>
              <path d="M181 82 C192 96 192 118 181 132" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round" opacity="0.5"></path>
              <path d="M32 92 C24 100 24 112 32 120" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round"></path>
              <path d="M19 82 C8 96 8 118 19 132" stroke="#F4B740" stroke-width="4.5" stroke-linecap="round" opacity="0.5"></path>
            </g>
          </sc-if>
        </svg>
      </span>
    </button>

    <div style="min-height: 34px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <p style="margin: 0; text-align: center; font-size: 17px; font-weight: 700; line-height: 1.7; color: {{ captionColor }};">{{ caption }}</p>
    </div>

    <h1 style="margin: 0; text-align: center; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 28px; font-weight: 700; color: #1B7F69; line-height: 1.5; animation: gh-pop .55s ease-out .1s both; flex-shrink: 0;">أكملت حصة اليوم!</h1>

    <div style="position: relative; background: #FFFFFF; border-radius: 26px; padding: 16px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 24px rgba(31, 61, 55, 0.05); animation: gh-rise .45s ease-out .35s both; flex-shrink: 0;">
      <span style="position: absolute; top: 6px; left: 64px; animation: gh-spark 1.8s ease-in-out .2s infinite;" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 2 L14 9.4 L21.5 12 L14 14.6 L12 22 L10 14.6 L2.5 12 L10 9.4 Z" fill="#F4B740"></path></svg>
      </span>
      <span style="flex-shrink: 0; animation: gh-float 3s ease-in-out infinite;" aria-hidden="true">
        <svg width="92" height="92" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" fill="#EAF6F2"></circle>
          <path d="M50 84 V40" stroke="#1B7F69" stroke-width="6.5" stroke-linecap="round"></path>
          <path d="M50 62 C34 62 24 53 24 38 C40 38 50 47 50 62 Z" fill="#2FA98C"></path>
          <path d="M50 54 C66 54 76 45 76 30 C60 30 50 39 50 54 Z" fill="#7ACBB6"></path>
          <g style="animation: gh-grow-up .8s ease-out .5s both; transform-origin: 50px 30px;">
            <circle cx="50" cy="26" r="13" fill="#2FA98C"></circle>
            <circle cx="38" cy="34" r="8" fill="#9BD9C8"></circle>
            <circle cx="62" cy="34" r="8" fill="#9BD9C8"></circle>
            <circle cx="44" cy="21" r="3.6" fill="#F4B740"></circle>
            <circle cx="58" cy="30" r="3" fill="#F4B740"></circle>
          </g>
          <circle cx="50" cy="86" r="5" fill="#F4B740"></circle>
        </svg>
      </span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 9px; min-width: 0;">
        <span style="display: flex; align-items: center; gap: 9px;">
          <span style="width: 30px; height: 30px; border-radius: 50%; background: #EAF6F2; display: flex; align-items: center; justify-content: center; flex-shrink: 0;" aria-hidden="true">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 12.5 L10 17.5 L19 7" stroke="#1B7F69" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </span>
          <span style="font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 20px; font-weight: 700; color: #1B7F69;">أكملت درس اليوم</span>
        </span>
        <span style="align-self: flex-start; background: #EAF6F2; color: #1B7F69; font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 7px 14px;">غرستك كبرت خطوة</span>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 26px; padding: 15px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 24px rgba(31, 61, 55, 0.05); animation: gh-rise .45s ease-out .6s both; flex-shrink: 0;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 14px; font-weight: 800;">أيامك المتتالية</span>
        <span style="background: #FDF1DA; color: #7A5209; font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 6px 12px;">٥ أيام</span>
      </div>
      <div style="display: flex; gap: 7px;">
        <span style="flex-grow: 1; height: 34px; border-radius: 12px; background: #EAF6F2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #1B7F69;">سبت</span>
        <span style="flex-grow: 1; height: 34px; border-radius: 12px; background: #EAF6F2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #1B7F69;">أحد</span>
        <span style="flex-grow: 1; height: 34px; border-radius: 12px; background: #EAF6F2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #1B7F69;">إثنين</span>
        <span style="flex-grow: 1; height: 34px; border-radius: 12px; background: #EAF6F2; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #1B7F69;">ثلاثاء</span>
        <span style="flex-grow: 1; height: 34px; border-radius: 12px; background: #F4B740; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #4A3206; animation: gh-pop .5s ease-out 1.1s both;">اليوم</span>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; flex-shrink: 0;">

      <sc-if value="{{ micLive }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
          <button type="button" onClick="{{ muteMic }}" aria-label="كتم الميكروفون" style="position: relative; width: 112px; height: 112px; border-radius: 50%; border: 0; background: #F4B740; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 14px 30px rgba(244, 183, 64, 0.40);">
            <span style="position: absolute; width: 112px; height: 112px; border-radius: 50%; background: rgba(244, 183, 64, 0.34); animation: gh-glow 1.5s ease-out infinite;"></span>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="position: relative;">
              <rect x="9" y="3" width="6" height="11" rx="3" fill="#FFFFFF"></rect>
              <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path>
            </svg>
          </button>
          <div style="height: 16px; display: flex; align-items: center; justify-content: center; gap: 3px;" aria-hidden="true">
            <sc-for list="{{voiceBars}}" as="v" hint-placeholder-count="21">
              <span style="width: 3px; height: {{ v.h }}px; border-radius: 2px; background: {{ v.c }}; flex-shrink: 0; animation: {{ v.anim }};"></span>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ micClosed }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
          <span style="position: relative; width: 112px; height: 112px; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{ micPrompt }}" hint-placeholder-val="{{ true }}">
              <span style="position: absolute; width: 112px; height: 112px; border-radius: 50%; background: rgba(244, 183, 64, 0.30); animation: gh-glow 1.5s ease-out infinite;"></span>
            </sc-if>
            <button type="button" onClick="{{ openMic }}" aria-label="افتح الميكروفون وأجب المعلّم" style="position: relative; width: 112px; height: 112px; border-radius: 50%; border: {{ micBorder }}; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 22px rgba(31, 61, 55, 0.08); opacity: {{ micOpacity }};">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="9" y="3" width="6" height="11" rx="3" stroke="{{ micInk }}" stroke-width="2"></rect>
                <path d="M5.5 11.5 C5.5 15.1 8.4 18 12 18 C15.6 18 18.5 15.1 18.5 11.5 M12 18 V21.2" stroke="{{ micInk }}" stroke-width="2" stroke-linecap="round"></path>
                <path d="M4.2 19.8 L19.8 4.2" stroke="#A8365C" stroke-width="2.4" stroke-linecap="round"></path>
              </svg>
            </button>
          </span>
          <span style="height: 16px;"></span>
        </div>
      </sc-if>

      <span style="height: 17px; text-align: center; font-size: 12.5px; color: {{ hintColor }}; font-weight: 700;">{{ hint }}</span>

      <a href="StudentHome.dc.html" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 22px; background: #1B7F69; color: #FFFFFF; font-family: 'Baloo Bhaijaan 2', 'Cairo', sans-serif; font-size: 20px; font-weight: 700; text-decoration: none; box-shadow: 0 12px 24px rgba(27, 127, 105, 0.26);">
        عودة للرئيسية
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 11 L12 4.5 L20 11 V19 C20 19.6 19.6 20 19 20 H5 C4.4 20 4 19.6 4 19 Z" stroke="#FFFFFF" stroke-width="2.1" stroke-linejoin="round"></path>
        </svg>
      </a>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1030}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { beat: 0 };
  }
  renderVals() {
    const b = this.state.beat;

    const praise = b === 0;
    const tomorrow = b === 1;
    const asking = b === 2;
    const hearing = b === 3;
    const bye = b === 4;

    const listening = hearing;
    const speaking = !listening;
    const happy = praise || bye;

    const captions = [
      'أحسنت يا عبدالله! أكملت درس اليوم.',
      'بكرة، قبل الدرس، علّمني كيف بررت والديك.',
      'تقدر تقول لي: أبشر؟',
      'أسمعك…',
      'أحسنت! أراك بكرة يا عبدالله.'
    ];
    const hints = [
      '',
      '',
      'أجب بصوتك: اضغط الميكروفون',
      'قل: أبشر',
      'إلى اللقاء غدًا'
    ];

    const hv = [9, 13, 7, 15, 11, 16, 6, 12, 15, 8, 14, 10, 16, 7, 13, 9, 15, 11, 6, 12, 8];
    const voiceBars = hv.map((h, i) => ({
      h: hearing ? h : 4,
      c: hearing ? '#1B7F69' : '#C9DED7',
      anim: hearing ? ('gh-wave .8s ease-in-out ' + (i * 0.05).toFixed(2) + 's infinite') : 'none'
    }));

    const at = (x) => this.state.beat === x;
    const later = (ms, x, fn) => { setTimeout(() => { if (at(x)) { fn(); } }, ms); };
    if (praise) { later(2400, 0, () => this.setState({ beat: 1 })); }
    if (tomorrow) { later(3400, 1, () => this.setState({ beat: 2 })); }
    if (hearing) { later(3000, 3, () => this.setState({ beat: 4 })); }

    return {
      teacherAnim: listening ? 'gh-lean 2.6s ease-in-out infinite' : 'gh-bob 1.7s ease-in-out infinite',
      glowColor: listening ? 'rgba(244, 183, 64, 0.26)' : 'rgba(47, 169, 140, 0.20)',
      mouthOpen: speaking,
      mouthShut: !speaking,
      showArcs: speaking,
      eyesOpen: !happy,
      eyesHappy: happy,
      eyeR: listening ? 11.5 : 10,

      caption: captions[b],
      captionColor: happy ? '#1B7F69' : '#1F3D37',
      hint: hints[b],
      hintColor: (asking || hearing) ? '#7A5209' : '#5C716C',

      voiceBars: voiceBars,
      micLive: hearing,
      muteMic: () => this.setState({ beat: 2 }),
      micClosed: !hearing,
      micPrompt: asking,
      micOpacity: asking ? '1' : (bye ? '0.45' : '0.5'),
      micBorder: asking ? '2px solid #F4B740' : '2px solid #E7DECB',
      micInk: asking ? '#1F3D37' : '#5C716C',

      openMic: () => this.setState({ beat: 3 }),
      next: () => {
        if (b === 0) { this.setState({ beat: 1 }); }
        else if (b === 1) { this.setState({ beat: 2 }); }
        else if (b === 3) { this.setState({ beat: 4 }); }
      }
    };
  }
}
</script>
</body>
